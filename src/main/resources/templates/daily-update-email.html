<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Update</title>
</head>

<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, Helvetica, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f8; padding:40px 0;">
    <tr>
        <td align="center">

            <table width="600" cellpadding="0" cellspacing="0"
                   style="background:#ffffff; border-radius:10px; overflow:hidden;
                          box-shadow:0 2px 8px rgba(0,0,0,0.08);">

                <!-- Header -->
                <tr>
                    <td style="background:#2563eb; padding:25px; text-align:center;">
                        <h1 style="margin:0; color:#ffffff; font-size:24px;">
                            Daily Update
                        </h1>
                    </td>
                </tr>

                <!-- Body -->
                <tr>
                    <td style="padding:40px; color:#333333;">

                        <p style="margin-top:0; font-size:16px;">
                            Hi <strong>{{username}}</strong>,
                        </p>

                        <p style="font-size:16px; line-height:1.6;">
                            Here is your daily update for
                            <strong>{{topic}}</strong>.
                        </p>

                        <p style="font-size:16px; line-height:1.6;">
                            Click the button below to review it.
                        </p>

                        <div style="text-align:center; margin:35px 0;">

                            <a href="{{link}}"
                               style="
                               background:#2563eb;
                               color:#ffffff;
                               text-decoration:none;
                               padding:14px 28px;
                               border-radius:6px;
                               font-size:16px;
                               display:inline-block;
                               font-weight:bold;">
                                Review Update
                            </a>

                        </div>

                        <p style="font-size:14px; color:#666666;">
                            If the button doesn't work, copy and paste the link below into your browser:
                        </p>

                        <p style="word-break:break-all;">
                            <a href="{{link}}" style="color:#2563eb;">
                                {{link}}
                            </a>
                        </p>

                        <br>

                        <p style="margin-bottom:0;">
                            Thanks,<br>
                            <strong>D-Corp</strong>
                        </p>

                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="background:#f8f9fa;
                               text-align:center;
                               padding:20px;
                               color:#888888;
                               font-size:12px;">

                        © {{year}} D-Corp. All rights reserved.

                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
